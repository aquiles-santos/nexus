<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <title>Nexus — Integração</title>
  <link rel="stylesheet" href="/assets/styles/tokens.css" />
  <link rel="stylesheet" href="/demo/integration/integration.css" />
</head>

<body>
  <header class="host-header">
    <div class="host-header__brand">
      <span class="host-name">CMS de exemplo</span>
      <span class="host-header__divider" aria-hidden="true"></span>
      <nav class="host-nav" aria-label="Demos">
        <a href="/demo/">Playground</a>
        <a href="/demo/integration/" aria-current="page">Integração</a>
      </nav>
    </div>
  </header>

  <main class="host-main">
    <article class="host-article">
      <h1>Nova publicação</h1>
      <p class="host-lead">
        Esta página monta o Nexus como um host faria: config em
        <code>nexus-config.js</code>, inicialização em
        <code>init-editor.js</code>.
      </p>

      <div class="host-form">


        <div class="host-field">
          <span class="host-label" id="post-body-label">Conteúdo</span>
          <div data-editor-root></div>
        </div>
      </div>


    </article>
  </main>

  <script type="module" src="/demo/integration/init-editor.js"></script>
</body>

</html>
